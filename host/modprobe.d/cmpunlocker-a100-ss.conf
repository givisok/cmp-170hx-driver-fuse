# cmpunlocker: SM-speed unlock for the A100-strapped CMP 170HX (10de:20b5).
# Without it the card boots, but its SMs stay throttled: ~9 TFLOPS instead of
# ~214 on an 8192^2 fp16 matmul. Needs the cmpunlocker nvidia.ko built with
# a100-ss-param.patch. To go back to the stock boot of that card, delete this
# file and reboot. See /root/CMP170HX-README.md.
options nvidia cmp_a100_ss=1
