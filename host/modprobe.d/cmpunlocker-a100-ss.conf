# cmpunlocker options for this rig (3x CMP 170HX after the OTP fuse burn).
#
# cmp_a100_ss=1 : SM-speed unlock for the A100-strapped card (10de:20b5). Without it
#                 the card boots, but its SMs stay throttled (~9 instead of ~214 TFLOPS).
# cmp_lmr=0x28b : NV_PFB_PRI_MMU_LOCAL_MEMORY_RANGE for the CMP pair (10de:20c2) =
#                 80 GiB. The built-in 8gb profile writes 0x20b = 64 GiB (8 FBP x 8 GiB);
#                 after the burn these cards have 10 FBP, so programs could only use
#                 63 GiB. 0x28b is the value a real A100 80GB carries. Needs the
#                 cmpunlocker nvidia.ko built with a100-ss-param.patch.
# Rollback: drop the option (or delete the file) and reboot.
options nvidia cmp_a100_ss=1 cmp_lmr=0x28b
